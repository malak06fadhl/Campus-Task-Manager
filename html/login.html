<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBalance — Login</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="auth-logo-mark">⚖️</div>
      <span class="auth-logo-text">StudyBalance</span>
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to manage your academic workload.</p>

    <div class="auth-error" id="loginError" role="alert"></div>

    <form class="auth-form" id="loginForm" novalidate>

      <div class="form-field">
        <label for="loginEmail">Email address</label>
        <input
          type="email"
          id="loginEmail"
          name="email"
          placeholder="you@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="loginPassword">Password</label>
        <input
          type="password"
          id="loginPassword"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
        Log in
      </button>

    </form>

    <p class="auth-switch">
      Don't have an account? <a href="register.html">Register</a>
    </p>

  </div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
