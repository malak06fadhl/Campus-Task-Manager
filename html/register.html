<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBalance — Register</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="auth-logo-mark">⚖️</div>
      <span class="auth-logo-text">StudyBalance</span>
    </a>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Start managing your academic workload today.</p>

    <div class="auth-error" id="registerError" role="alert"></div>

    <form class="auth-form" id="registerForm" novalidate>

      <div class="form-field">
        <label for="registerName">Full name</label>
        <input
          type="text"
          id="registerName"
          name="name"
          placeholder="Alex Johnson"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-field">
        <label for="registerEmail">Email address</label>
        <input
          type="email"
          id="registerEmail"
          name="email"
          placeholder="you@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="registerPassword">Password</label>
        <input
          type="password"
          id="registerPassword"
          name="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-field">
        <label for="registerConfirm">Confirm password</label>
        <input
          type="password"
          id="registerConfirm"
          name="confirm"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
        Create account
      </button>

    </form>

    <p class="auth-switch">
      Already have an account? <a href="login.html">Log in</a>
    </p>

  </div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
