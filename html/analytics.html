<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBalance — Analytics</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="page-shell">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-logo">
        <div class="sidebar-logo-mark">⚖️</div>
        <span class="sidebar-logo-text">StudyBalance</span>
      </a>
      <nav class="sidebar-nav">
        <span class="sidebar-nav-label">Main Menu</span>
        <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="courses.html"><span class="nav-icon">📚</span> Courses</a>
        <a href="task-management.html"><span class="nav-icon">✅</span> Tasks</a>
        <a href="analytics.html"><span class="nav-icon">📊</span> Analytics</a>
        <a href="heatmap.html"><span class="nav-icon">🗓️</span> Heatmap</a>
        <a href="scenario.html"><span class="nav-icon">📈</span> What-If Scenario</a>
        <span class="sidebar-nav-label">Account</span>
        <a href="profile.html"><span class="nav-icon">👤</span> Profile</a>
      </nav>
    </aside>

    <!-- ── Page body ── -->
    <div class="page-body">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-search">
          <span class="topbar-search-icon">🔍</span>
          <input type="search" placeholder="Search analytics…" id="topbarSearch" />
        </div>
        <div class="topbar-right">
          <button class="btn btn-ghost btn-icon" title="Notifications" aria-label="Notifications">🔔</button>
          <div class="user-chip">
            <div class="user-avatar">A</div>
            <div class="user-chip-info">
              <span class="user-chip-name">Student</span>
              <span class="user-chip-role">Student</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main content -->
      <main class="main-content">

        <!-- Page header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Analytics</h1>
            <p class="page-subtitle">Insights into your academic workload and progress.</p>
          </div>
        </div>

        <!-- Summary cards -->
        <div class="summary-grid" id="analyticsSummary">
          <!-- rendered by analytics.js -->
        </div>

        <!-- Insight cards -->
        <div id="insightCards">
          <!-- rendered by analytics.js -->
        </div>

        <!-- Charts row: Status + Priority -->
        <div class="analytics-grid">

          <!-- Tasks by Status -->
          <div class="widget">
            <div class="widget-header">
              <span class="widget-title">📊 Tasks by Status</span>
            </div>
            <div id="chartStatus">
              <!-- rendered by analytics.js -->
            </div>
          </div>

          <!-- Tasks by Priority -->
          <div class="widget">
            <div class="widget-header">
              <span class="widget-title">🎯 Tasks by Priority</span>
            </div>
            <div id="chartPriority">
              <!-- rendered by analytics.js -->
            </div>
          </div>

        </div>

        <!-- Tasks by Course -->
        <div class="widget">
          <div class="widget-header">
            <span class="widget-title">📚 Tasks by Course</span>
          </div>
          <div id="chartCourse">
            <!-- rendered by analytics.js -->
          </div>
        </div>

        <!-- Course progress -->
        <div class="widget">
          <div class="widget-header">
            <span class="widget-title">📈 Course Progress</span>
            <a href="courses.html" class="widget-link">Manage courses →</a>
          </div>
          <div id="courseProgressSection">
            <!-- rendered by analytics.js -->
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/analytics.js"></script>
</body>
</html>
